<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FastTime - Previsão do tempo</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <header>
    <h1>WeatherGlass - Clima</h1>
  </header>

  <main>

    <section class="area-pesquisa">
      <label for="campoCidade">Digite o nome da cidade e pressione Enter:</label>
      <input type="text" id="campoCidade" placeholder="Exemplo: Jacareí" autocomplete="off">

    <section id="areaStatus" class="area-status"></section>

  </main>

  <footer>
    <p> WeatherGlass - Previsão do tempo - Dados obtidos da BrasilAPI (CPTEC/INPE)</p>
  </footer>

    <script src="script.js"></script>

</html>
